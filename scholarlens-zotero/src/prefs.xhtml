<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml">
  <groupbox>
    <label><html:h2>ScholarLens · 学术划词翻译</html:h2></label>
    <description>在 Zotero PDF 阅读器中划词后，按 Alt+T 翻译、Alt+Shift+E 解释（选区弹出层的按钮在部分 Zotero 版本收不到点击）。
      公式（$...$、\(...\) 等）会以占位符保护并在译文中用 KaTeX 还原。</description>
  </groupbox>

  <groupbox id="scholarlens-api-group">
    <label><html:h3>API 接口</html:h3></label>
    <hbox align="center">
      <label style="width: 110px" control="scholarlens-apiBase">API Base URL</label>
      <html:input id="scholarlens-apiBase" type="text" flex="1" placeholder="https://api.deepseek.com/v1" />
    </hbox>
    <hbox align="center">
      <label style="width: 110px" control="scholarlens-apiKey">API Key</label>
      <html:input id="scholarlens-apiKey" type="password" flex="1" placeholder="sk-..." />
    </hbox>
    <hbox align="center">
      <label style="width: 110px" control="scholarlens-model">模型名称</label>
      <html:input id="scholarlens-model" type="text" flex="1" placeholder="deepseek-chat" />
    </hbox>
    <hbox align="center">
      <label style="width: 110px">常用预设</label>
      <button id="scholarlens-preset-deepseek" label="DeepSeek" />
      <button id="scholarlens-preset-openai" label="OpenAI" />
      <button id="scholarlens-preset-ollama" label="本地 Ollama" />
    </hbox>
    <hbox align="center" style="margin-top: 6px">
      <label style="width: 110px" />
      <button id="scholarlens-test" label="测试连接" />
      <label id="scholarlens-test-status" flex="1" />
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h3>翻译偏好</html:h3></label>
    <hbox align="center">
      <label style="width: 110px" control="scholarlens-targetLanguage">目标语言</label>
      <html:input id="scholarlens-targetLanguage" type="text" flex="1" placeholder="简体中文" />
    </hbox>
    <hbox align="center">
      <label style="width: 110px" control="scholarlens-temperature">Temperature</label>
      <html:input id="scholarlens-temperature" type="number" min="0" max="2" step="0.1" style="width: 90px" />
    </hbox>
    <label control="scholarlens-customPrompt">领域 / 术语 / 风格偏好（可选，插入系统提示词）</label>
    <html:textarea id="scholarlens-customPrompt" rows="4" style="width: 100%"
                   placeholder="例如：凝聚态物理 / 机器学习势方向；nuclear quantum effects 译作「核量子效应」…"></html:textarea>
    <description>设置在输入时自动保存。API Key 仅保存在本机 Zotero 配置中，不会上传。</description>
  </groupbox>
</vbox>
